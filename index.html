<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sad Ringtone Status Maker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#070b16;--panel:#0e1426;--line:#1f2a48;--text:#dce6ff;--muted:#7c8bb5;--a:#34e0ff}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:500px;margin:0 auto;padding:14px;display:grid;gap:12px}
h1{font-size:21px;margin:4px 0 0}
p{margin:0;color:var(--muted)}
canvas{display:block;width:100%;aspect-ratio:9/16;background:#000;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,label.btn{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;min-height:44px}
button:hover,label.btn:hover{border-color:var(--a)}
button:focus-visible,label.btn:focus-within,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--a);color:var(--a)}
button:disabled{opacity:.4;cursor:not-allowed}
.rec[aria-pressed="true"]{border-color:#ff4f6a;color:#ff4f6a}
.ctl{display:flex;align-items:center;gap:8px;color:var(--muted);width:100%}
input[type=text]{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font:inherit;flex:1}
input[type=color]{width:44px;height:36px;border:1px solid var(--line);background:none;border-radius:6px;padding:2px;cursor:pointer}
input[type=range]{accent-color:var(--a);flex:1}
audio{width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#msg{min-height:1.4em}
</style>
</head>
<body>
<main>
  <div>
    <h1>Sad Call Status Generator</h1>
    <p>Upload a photo and ringtone to create a video status with phone call controls.</p>
  </div>

  <!-- 9:16 Vertical Video Screen Canvas -->
  <canvas id="c" width="1080" height="1920" aria-label="Ringtone status visualization"></canvas>

  <div class="row">
    <label class="btn">Add Photo<input class="sr" id="photo" type="file" accept="image/*"></label>
    <label class="btn">Add Song / Ringtone<input class="sr" id="song" type="file" accept="audio/*"></label>
  </div>

  <audio id="player" controls></audio>

  <div class="row">
    <label class="ctl">Status Title: <input type="text" id="statusTitle" value="Broken"></label>
    <label class="ctl">Wave Color: <input type="color" id="waveCol" value="#ffffff"></label>
    <label class="ctl">Top Blur <input type="range" id="topBlur" min="0" max="30" value="15"></label>
    <label class="ctl">Dim Overlay <input type="range" id="dim" min="0" max="0.7" step="0.05" value="0.25"></label>
  </div>

  <div class="row">
    <button id="dlSong" disabled>Download Audio</button>
    <button id="rec" class="rec" aria-pressed="false" disabled>Record Video (9:16)</button>
    <a id="dlVid" class="btn" hidden></a>
  </div>
  <p id="msg" role="status"></p>
</main>

<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  var player=document.getElementById('player'),msg=document.getElementById('msg');
  var dlSong=document.getElementById('dlSong'),recBtn=document.getElementById('rec'),dlVid=document.getElementById('dlVid');
  var AC,an,msrc,recDest,tdata,fdata,img=null,songFile=null,songUrl=null,title='Broken';
  var waveColor='#ffffff',topBlurVal=15,dimVal=0.25;
  var recorder=null,chunks=[],vidUrl=null,bass=0;

  // Dust Bokeh Particle System
  var particles=[];
  for(var p=0;p<45;p++){
    particles.push({
      x:Math.random()*W,
      y:Math.random()*H,
      r:Math.random()*5+2,
      vy:-Math.random()*1.5-0.5,
      alpha:Math.random()*0.6+0.2
    });
  }

  function say(t){msg.textContent=t}

  function initAudio(){
    if(AC)return;
    AC=new (window.AudioContext||window.webkitAudioContext)();
    an=AC.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=0.8;
    msrc=AC.createMediaElementSource(player);
    recDest=AC.createMediaStreamDestination();
    msrc.connect(an);an.connect(AC.destination);an.connect(recDest);
    tdata=new Uint8Array(an.fftSize);fdata=new Uint8Array(an.frequencyBinCount);
  }
  player.addEventListener('play',function(){initAudio();if(AC.state==='suspended')AC.resume()});

  document.getElementById('photo').onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var im=new Image();
    im.onload=function(){img=im;say('Photo loaded successfully.')};
    im.src=URL.createObjectURL(f);
  };

  document.getElementById('song').onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    if(songUrl)URL.revokeObjectURL(songUrl);
    songFile=f;songUrl=URL.createObjectURL(f);
    player.src=songUrl;
    dlSong.disabled=false;recBtn.disabled=false;
    say('Song added. Tap play or record video.');
  };

  document.getElementById('statusTitle').oninput=function(e){title=e.target.value};
  document.getElementById('waveCol').oninput=function(e){waveColor=e.target.value};
  document.getElementById('topBlur').oninput=function(e){topBlurVal=parseFloat(e.target.value)};
  document.getElementById('dim').oninput=function(e){dimVal=parseFloat(e.target.value)};

  dlSong.onclick=function(){
    if(!songFile)return;
    var a=document.createElement('a');a.href=songUrl;a.download=songFile.name;
    document.body.appendChild(a);a.click();a.remove();
  };

  function pickMime(){
    var t=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'];
    for(var i=0;i<t.length;i++){if(window.MediaRecorder&&MediaRecorder.isTypeSupported(t[i]))return t[i]}
    return '';
  }

  function stopRec(){if(recorder&&recorder.state!=='inactive')recorder.stop()}

  recBtn.onclick=function(){
    if(recorder&&recorder.state==='recording'){stopRec();player.pause();return}
    if(!window.MediaRecorder){say('Video recording is not supported in this browser.');return}
    initAudio();if(AC.state==='suspended')AC.resume();
    var mime=pickMime(),vs=cv.captureStream(30),
        stream=new MediaStream(vs.getVideoTracks().concat(recDest.stream.getAudioTracks()));
    chunks=[];
    try{recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined)}catch(err){say('Could not start recording.');return}
    recorder.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};
    recorder.onstop=function(){
      var type=recorder.mimeType||'video/webm',ext=type.indexOf('mp4')>-1?'mp4':'webm';
      var blob=new Blob(chunks,{type:type});
      if(vidUrl)URL.revokeObjectURL(vidUrl);
      vidUrl=URL.createObjectURL(blob);
      dlVid.href=vidUrl;dlVid.download=(title||'status-video')+'.'+ext;
      dlVid.textContent='Download status video (.'+ext+')';dlVid.hidden=false;
      recBtn.setAttribute('aria-pressed','false');recBtn.textContent='Record Video (9:16)';
      player.removeEventListener('ended',stopRec);
      say('Video ready! Click download below.');
    };
    player.addEventListener('ended',stopRec);
    dlVid.hidden=true;
    player.currentTime=0;
    recorder.start(500);
    player.play();
    recBtn.setAttribute('aria-pressed','true');recBtn.textContent='Stop recording';
    say('Recording 9:16 vertical video...');
  };

  function drawCover(im, x, y, w, h, zoom){
    var r = Math.max(w / im.width, h / im.height) * zoom;
    var nw = im.width * r, nh = im.height * r;
    ctx.drawImage(im, x + (w - nw) / 2, y + (h - nh) / 2, nw, nh);
  }

  function drawPhoneIcon(x, y, radius, color, isDecline){
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.translate(x, y);
    if(isDecline) ctx.rotate(Math.PI * 0.75);
    else ctx.rotate(Math.PI * 0.1);

    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.45, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.rect(-radius*0.25, -radius*0.1, radius*0.5, radius*0.2);
    ctx.fill();
    ctx.restore();
  }

  function renderParticles(){
    ctx.fillStyle = '#ffffff';
    for(var i=0; i<particles.length; i++){
      var pt = particles[i];
      pt.y += pt.vy * (1 + bass * 1.5);
      if(pt.y < 0) pt.y = H;
      ctx.globalAlpha = pt.alpha * (0.3 + bass * 0.7);
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r * (1 + bass * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1.0;
  }

  function draw(){
    requestAnimationFrame(draw);

    var playing = an && !player.paused;
    if(playing){
      an.getByteTimeDomainData(tdata);an.getByteFrequencyData(fdata);
      var s = 0; for(var i=0; i<10; i++) s += fdata[i];
      bass = bass * 0.8 + (s / 10 / 255) * 0.2;
    }else bass *= 0.9;

    // Background Render
    if(img){
      ctx.save();
      ctx.filter = 'blur(' + topBlurVal + 'px)';
      drawCover(img, 0, 0, W, H * 0.55, 1.1 + bass * 0.03);
      ctx.restore();

      drawCover(img, 0, H * 0.45, W, H * 0.55, 1.0 + bass * 0.02);
    } else {
      var bgG = ctx.createLinearGradient(0, 0, 0, H);
      bgG.addColorStop(0, '#2c3e50'); bgG.addColorStop(1, '#000000');
      ctx.fillStyle = bgG; ctx.fillRect(0, 0, W, H);
    }

    ctx.fillStyle = 'rgba(0,0,0,' + dimVal + ')';
    ctx.fillRect(0, 0, W, H);

    renderParticles();

    // Top "Broken 💔" Title Overlay
    var titleY = H * 0.22;
    ctx.textAlign = 'center';
    ctx.font = '900 110px system-ui,-apple-system,sans-serif';
    
    ctx.shadowColor = 'rgba(0, 0, 0, 0.95)';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#ffffff';
    
    var txt = title || 'Broken';
    ctx.fillText(txt, W / 2 - 40, titleY);
    ctx.shadowBlur = 0;

    ctx.font = '100px system-ui';
    ctx.fillText('', W / 2 + (ctx.measureText(txt).width / 2) + 10, titleY - 5);

    // --- Dynamic Color Center Audio Bars ---
    var visY = H * 0.64;
    var barCount = 5;
    var barWidth = 24;
    var barGap = 20;
    var totalW = barCount * (barWidth + barGap) - barGap;
    var startX = (W - totalW) / 2;

    for(var i = 0; i < barCount; i++){
      var val = 0;
      if(playing && fdata) val = fdata[i * 4] / 255;
      var h = Math.max(24, val * 120 + (i === 2 ? 20 : 0));
      
      ctx.beginPath();
      ctx.roundRect(startX + i * (barWidth + barGap), visY - h / 2, barWidth, h, 12);
      ctx.fillStyle = waveColor;
      ctx.shadowColor = waveColor;
      ctx.shadowBlur = 20;
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Call Interface (Decline & Accept Buttons)
    var callY = H * 0.74;
    var btnRadius = 80 + (bass * 6);

    drawPhoneIcon(W * 0.3, callY, btnRadius, '#ff3b30', true);
    ctx.fillStyle = '#ffffff';
    ctx.font = '600 38px system-ui';
    ctx.fillText('Decline', W * 0.3, callY + btnRadius + 50);

    drawPhoneIcon(W * 0.7, callY, btnRadius, '#34c759', false);
    ctx.fillStyle = '#ffffff';
    ctx.font = '600 38px system-ui';
    ctx.fillText('Accept', W * 0.7, callY + btnRadius + 50);

    ctx.font = '400 30px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('📷  @Dintone', W / 2, H * 0.06);
  }

  draw();
})();
</script>
</body>
</html>
