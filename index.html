<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Status Video Creator Studio - Pro Edition</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#070b16;--panel:#0e1426;--line:#1f2a48;--text:#dce6ff;--muted:#7c8bb5;--a:#34e0ff}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:14px;display:grid;gap:14px}
h1{font-size:21px;margin:4px 0 0}
p{margin:0;color:var(--muted)}
canvas{display:block;width:100%;aspect-ratio:9/16;background:#000;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,label.btn{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;min-height:44px}
button:hover,label.btn:hover{border-color:var(--a)}
button:focus-visible,label.btn:focus-within,input:focus-visible,select:focus-visible{outline:2px solid var(--a);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--a);color:var(--a)}
button:disabled{opacity:.4;cursor:not-allowed}
.rec[aria-pressed="true"]{border-color:#ff4f6a;color:#ff4f6a}
.ctl{display:flex;align-items:center;gap:8px;color:var(--muted);width:100%}
.ctl label{min-width:110px;font-size:13px}
input[type=text],select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font:inherit;flex:1}
input[type=color]{width:44px;height:36px;border:1px solid var(--line);background:none;border-radius:6px;padding:2px;cursor:pointer}
input[type=range]{accent-color:var(--a);flex:1}
audio{width:100%}
.panel-sec{background:rgba(255,255,255,0.02);border:1px solid var(--line);padding:12px;border-radius:10px;display:grid;gap:10px}
.panel-sec h2{font-size:14px;margin:0;color:var(--a);text-transform:uppercase;letter-spacing:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#msg{min-height:1.4em;color:var(--a)}
</style>
</head>
<body>
<main>
  <div>
    <h1>Status Video Creator Studio</h1>
    <p>Upload media, customize text, particle effects, colors, and export 9:16 vertical videos.</p>
  </div>

  <canvas id="c" width="1080" height="1920" aria-label="Ringtone status visualization"></canvas>

  <div class="row">
    <label class="btn">Add Photo<input class="sr" id="photo" type="file" accept="image/*"></label>
    <label class="btn">Add Song / Ringtone<input class="sr" id="song" type="file" accept="audio/*"></label>
  </div>

  <audio id="player" controls></audio>

  <div class="panel-sec">
    <h2>Text & Typography</h2>
    <div class="row">
      <div class="ctl"><label>Title Text</label><input type="text" id="statusTitle" value="Broken"></div>
      <div class="ctl"><label>Title Color</label><input type="color" id="titleCol" value="#ffffff"></div>
      <div class="ctl"><label>Emoji Accent</label><input type="text" id="emojiAccent" value="💔" style="max-width:80px;"></div>
      <div class="ctl"><label>Font Style</label>
        <select id="fontSelect">
          <option value="system-ui">Modern Sans</option>
          <option value="Impact">Bold Impact</option>
          <option value="Georgia">Classic Serif</option>
          <option value="cursive">Cursive / Script</option>
          <option value="monospace">Monospace</option>
        </select>
      </div>
      <div class="ctl"><label>Social Handle</label><input type="text" id="handleText" value="📷  @RINGTONEEFFECT"></div>
    </div>
  </div>

  <div class="panel-sec">
    <h2>Audio Visualizer Settings</h2>
    <div class="row" id="modes" role="group" aria-label="Wave Style">
      <button data-m="dots" aria-pressed="true">Call Dots</button>
      <button data-m="wave" aria-pressed="false">Sine Wave</button>
      <button data-m="ring" aria-pressed="false">Center Ring</button>
      <button data-m="eq" aria-pressed="false">Equalizer Bars</button>
    </div>
    <div class="row">
      <div class="ctl"><label>Wave Color</label><input type="color" id="waveCol" value="#ffffff"></div>
      <div class="ctl"><label>Wave Glow</label><input type="range" id="glowPower" min="0" max="40" value="20"></div>
    </div>
  </div>

  <div class="panel-sec">
    <h2>Effects & Photo Filters</h2>
    <div class="row">
      <div class="ctl"><label>Particle Type</label>
        <select id="partType">
          <option value="bokeh">Glowing Bokeh</option>
          <option value="hearts">Floating Hearts (❤️)</option>
          <option value="stars">Glowing Stars (✨)</option>
          <option value="none">None</option>
        </select>
      </div>
      <div class="ctl"><label>Photo Filter</label>
        <select id="photoFilter">
          <option value="none">Normal</option>
          <option value="grayscale(100%)">Black & White</option>
          <option value="sepia(80%)">Warm Sepia</option>
          <option value="contrast(140%) brightness(90%)">High Contrast</option>
          <option value="hue-rotate(180deg)">Cool Hue</option>
        </select>
      </div>
      <div class="ctl"><label>Top Blur</label><input type="range" id="topBlur" min="0" max="30" value="15"></div>
      <div class="ctl"><label>Dim Overlay</label><input type="range" id="dim" min="0" max="0.8" step="0.05" value="0.25"></div>
      <div class="ctl"><label>Show Call UI</label><input type="checkbox" id="showCallUI" checked style="width:20px;height:20px;"></div>
    </div>
  </div>

  <div class="row">
    <button id="dlSong" disabled>Download Audio</button>
    <button id="rec" class="rec" aria-pressed="false" disabled>Record Video (9:16)</button>
    <a id="dlVid" class="btn" hidden></a>
  </div>
  <p id="msg" role="status"></p>
</main>

<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  var player=document.getElementById('player'),msg=document.getElementById('msg');
  var dlSong=document.getElementById('dlSong'),recBtn=document.getElementById('rec'),dlVid=document.getElementById('dlVid');
  var AC,an,msrc,recDest,tdata,fdata,img=null,songFile=null,songUrl=null;
  
  var title='Broken', titleColor='#ffffff', emoji='💔', fontStyle='system-ui', handle='📷  @RINGTONEEFFECT';
  var waveColor='#ffffff', glowBlur=20, waveMode='dots';
  var particleType='bokeh', currentFilter='none', topBlurVal=15, dimVal=0.25, showCall=true;
  var recorder=null,chunks=[],vidUrl=null,bass=0;

  var blurCanvas = document.createElement('canvas');
  var blurCtx = blurCanvas.getContext('2d');
  blurCanvas.width = W / 4;
  blurCanvas.height = (H * 0.55) / 4;

  var particles=[];
  for(var p=0;p<25;p++){
    particles.push({
      x:Math.random()*W,
      y:Math.random()*H,
      r:Math.random()*5+2,
      vy:-Math.random()*1.5-0.5,
      alpha:Math.random()*0.6+0.2
    });
  }

  function say(t){msg.textContent=t}

  function updateBlurCanvas(){
    if(!img) return;
    blurCtx.clearRect(0,0,blurCanvas.width,blurCanvas.height);
    blurCtx.filter = (currentFilter !== 'none' ? currentFilter + ' ' : '') + 'blur(' + (topBlurVal/4) + 'px)';
    var r = Math.max(blurCanvas.width / img.width, blurCanvas.height / img.height);
    var nw = img.width * r, nh = img.height * r;
    blurCtx.drawImage(img, (blurCanvas.width - nw) / 2, (blurCanvas.height - nh) / 2, nw, nh);
  }

  function initAudio(){
    if(AC)return;
    AC=new (window.AudioContext||window.webkitAudioContext)();
    an=AC.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=0.8;
    msrc=AC.createMediaElementSource(player);
    recDest=AC.createMediaStreamDestination();
    msrc.connect(an);an.connect(AC.destination);an.connect(recDest);
    tdata=new Uint8Array(an.fftSize);fdata=new Uint8Array(an.frequencyBinCount);
  }
  player.addEventListener('play',function(){initAudio();if(AC.state==='suspended')AC.resume()});

  document.getElementById('photo').onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var im=new Image();
    im.onload=function(){
      img=im;
      updateBlurCanvas();
      say('Photo loaded.');
    };
    im.src=URL.createObjectURL(f);
  };

  document.getElementById('song').onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    if(songUrl)URL.revokeObjectURL(songUrl);
    songFile=f;songUrl=URL.createObjectURL(f);
    player.src=songUrl;
    dlSong.disabled=false;recBtn.disabled=false;
    say('Song loaded. Ready to record.');
  };

  document.getElementById('statusTitle').oninput=function(e){title=e.target.value};
  document.getElementById('titleCol').oninput=function(e){titleColor=e.target.value};
  document.getElementById('emojiAccent').oninput=function(e){emoji=e.target.value};
  document.getElementById('fontSelect').onchange=function(e){fontStyle=e.target.value};
  document.getElementById('handleText').oninput=function(e){handle=e.target.value};
  
  document.getElementById('waveCol').oninput=function(e){waveColor=e.target.value};
  document.getElementById('glowPower').oninput=function(e){glowBlur=parseFloat(e.target.value)};
  document.getElementById('modes').onclick=function(e){
    var b=e.target.closest('button');if(!b)return;waveMode=b.dataset.m;
    [].forEach.call(this.querySelectorAll('button'),function(x){x.setAttribute('aria-pressed',x===b)});
  };

  document.getElementById('partType').onchange=function(e){particleType=e.target.value};
  document.getElementById('photoFilter').onchange=function(e){currentFilter=e.target.value; updateBlurCanvas();};
  document.getElementById('topBlur').oninput=function(e){topBlurVal=parseFloat(e.target.value); updateBlurCanvas();};
  document.getElementById('dim').oninput=function(e){dimVal=parseFloat(e.target.value)};
  document.getElementById('showCallUI').onchange=function(e){showCall=e.target.checked};

  dlSong.onclick=function(){
    if(!songFile)return;
    var a=document.createElement('a');a.href=songUrl;a.download=songFile.name;
    document.body.appendChild(a);a.click();a.remove();
  };

  function pickMime(){
    var t=[
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
      'video/mp4',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];
    for(var i=0;i<t.length;i++){
      if(window.MediaRecorder && MediaRecorder.isTypeSupported(t[i])) return t[i];
    }
    return '';
  }

  function stopRec(){
    if(recorder && recorder.state !== 'inactive') {
      recorder.stop();
    }
  }

  recBtn.onclick=function(){
    if(recorder && recorder.state === 'recording'){
      stopRec();
      player.pause();
      return;
    }
    
    if(!window.MediaRecorder){
      say('Video recording is not supported in this browser.');
      return;
    }
    
    initAudio();
    if(AC.state==='suspended') AC.resume();
    
    var selectedMime = pickMime();
    
    // Explicit 30 FPS stream setup
    var vs = cv.captureStream(30);
    var audioTrack = recDest.stream.getAudioTracks()[0];
    
    var combinedTracks = vs.getVideoTracks();
    if(audioTrack) combinedTracks.push(audioTrack);
    
    var stream = new MediaStream(combinedTracks);
    chunks = [];

    try {
      recorder = new MediaRecorder(stream, {
        mimeType: selectedMime || undefined,
        videoBitsPerSecond: 2500000 // Stable bitrate to prevent memory caps
      });
    } catch(err) {
      say('Failed to start recorder.');
      return;
    }

    recorder.ondataavailable = function(e){
      if(e.data && e.data.size > 0){
        chunks.push(e.data);
      }
    };

    recorder.onstop = function(){
      var actualType = recorder.mimeType || 'video/mp4';
      var ext = actualType.includes('mp4') ? 'mp4' : 'webm';
      var blob = new Blob(chunks, { type: actualType });
      
      if(vidUrl) URL.revokeObjectURL(vidUrl);
      vidUrl = URL.createObjectURL(blob);
      
      dlVid.href = vidUrl;
      dlVid.download = (title.trim() || 'status-video') + '.' + ext;
      dlVid.textContent = 'Download Full Video (.' + ext.toUpperCase() + ')';
      dlVid.hidden = false;
      
      recBtn.setAttribute('aria-pressed','false');
      recBtn.textContent = 'Record Video (9:16)';
      player.removeEventListener('ended', stopRec);
      say('Complete video generated!');
    };

    player.addEventListener('ended', stopRec);
    dlVid.hidden = true;
    player.currentTime = 0;
    
    // 1000ms timeslice ensures data streams continually to memory without stopping at 4s
    recorder.start(1000); 
    player.play();
    
    recBtn.setAttribute('aria-pressed','true');
    recBtn.textContent = 'Stop Recording';
    say('Recording full video... Please keep this tab active.');
  };

  function drawCover(im, x, y, w, h, zoom){
    var r = Math.max(w / im.width, h / im.height) * zoom;
    var nw = im.width * r, nh = im.height * r;
    ctx.drawImage(im, x + (w - nw) / 2, y + (h - nh) / 2, nw, nh);
  }

  function drawPhoneIcon(x, y, radius, color, isDecline){
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.translate(x, y);
    if(isDecline) ctx.rotate(Math.PI * 0.75);
    else ctx.rotate(Math.PI * 0.1);

    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.45, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.rect(-radius*0.25, -radius*0.1, radius*0.5, radius*0.2);
    ctx.fill();
    ctx.restore();
  }

  function renderParticles(){
    if(particleType==='none')return;
    for(var i=0; i<particles.length; i++){
      var pt = particles[i];
      pt.y += pt.vy * (1 + bass * 1.2);
      if(pt.y < 0) pt.y = H;
      ctx.globalAlpha = pt.alpha * (0.3 + bass * 0.7);

      if(particleType==='bokeh'){
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.r * (1 + bass * 0.5), 0, Math.PI * 2);
        ctx.fill();
      }else if(particleType==='hearts'){
        ctx.font = Math.floor(pt.r * 6) + 'px system-ui';
        ctx.fillText('❤️', pt.x, pt.y);
      }else if(particleType==='stars'){
        ctx.font = Math.floor(pt.r * 6) + 'px system-ui';
        ctx.fillText('✨', pt.x, pt.y);
      }
    }
    ctx.globalAlpha = 1.0;
  }

  function drawVisualizer(playing){
    var visY = showCall ? H * 0.64 : H * 0.72;
    ctx.fillStyle = waveColor;
    ctx.strokeStyle = waveColor;
    ctx.shadowColor = waveColor;
    ctx.shadowBlur = glowBlur;

    if(waveMode === 'dots'){
      var barCount = 5, barWidth = 24, barGap = 20;
      var totalW = barCount * (barWidth + barGap) - barGap, startX = (W - totalW) / 2;
      for(var i = 0; i < barCount; i++){
        var val = 0; if(playing && fdata) val = fdata[i * 4] / 255;
        var h = Math.max(24, val * 120 + (i === 2 ? 20 : 0));
        ctx.beginPath();
        ctx.roundRect(startX + i * (barWidth + barGap), visY - h / 2, barWidth, h, 12);
        ctx.fill();
      }
    }else if(waveMode === 'wave'){
      ctx.lineWidth = 6;
      ctx.beginPath();
      var N = tdata ? tdata.length : 2, st = W / N;
      var prevX = 0, prevY = visY;
      ctx.moveTo(prevX, prevY);
      for(var i = 0; i < N; i += 8){
        var prog = i / N, env = Math.sin(prog * Math.PI);
        var rawVal = playing ? (tdata[i] - 128) / 128 : 0;
        var y = visY + (rawVal * 160 * env);
        var x = i * st;
        var xc = (x + prevX) / 2, yc = (y + prevY) / 2;
        ctx.quadraticCurveTo(prevX, prevY, xc, yc);
        prevX = x; prevY = y;
      }
      ctx.stroke();
    }else if(waveMode === 'ring'){
      var cx = W / 2, cy = visY, r0 = 100, P = 60;
      ctx.lineWidth = 5;
      ctx.beginPath();
      for(var i = 0; i <= P; i++){
        var k = i % P, v = playing ? (tdata[Math.floor(k / P * tdata.length)] - 128) / 128 : 0;
        var a = k / P * Math.PI * 2, r = r0 * (1 + bass * 0.4) + v * 35;
        var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    }else if(waveMode === 'eq'){
      var n = 24, bw = W / n, use = Math.floor(fdata ? fdata.length * 0.5 / n : 1);
      for(var i = 0; i < n; i++){
        var v = 0; if(playing){for(var j = 0; j < use; j++) v += fdata[i * use + j]; v /= use * 255;}
        var bh = Math.max(6, v * 180);
        ctx.fillRect(i * bw + bw * 0.2, visY - bh / 2, bw * 0.6, bh);
      }
    }
    ctx.shadowBlur = 0;
  }

  function draw(){
    requestAnimationFrame(draw);

    var playing = an && !player.paused;
    if(playing){
      an.getByteTimeDomainData(tdata);an.getByteFrequencyData(fdata);
      var s = 0; for(var i=0; i<8; i++) s += fdata[i];
      bass = bass * 0.8 + (s / 8 / 255) * 0.2;
    }else bass *= 0.9;

    if(img){
      ctx.drawImage(blurCanvas, 0, 0, W, H * 0.55);
      ctx.save();
      if(currentFilter !== 'none') ctx.filter = currentFilter;
      drawCover(img, 0, H * 0.45, W, H * 0.55, 1.0 + bass * 0.02);
      ctx.restore();
    } else {
      var bgG = ctx.createLinearGradient(0, 0, 0, H);
      bgG.addColorStop(0, '#2c3e50'); bgG.addColorStop(1, '#000000');
      ctx.fillStyle = bgG; ctx.fillRect(0, 0, W, H);
    }

    ctx.fillStyle = 'rgba(0,0,0,' + dimVal + ')';
    ctx.fillRect(0, 0, W, H);

    renderParticles();

    var titleY = H * 0.22;
    ctx.textAlign = 'center';
    ctx.font = '900 110px ' + fontStyle;
    
    ctx.shadowColor = 'rgba(0, 0, 0, 0.95)';
    ctx.shadowBlur = 20;
    ctx.fillStyle = titleColor;
    
    var txt = title || 'Broken';
    ctx.fillText(txt, W / 2 - (emoji ? 35 : 0), titleY);
    ctx.shadowBlur = 0;

    if(emoji){
      ctx.font = '100px system-ui';
      ctx.fillText(emoji, W / 2 + (ctx.measureText(txt).width / 2) + 15, titleY - 5);
    }

    drawVisualizer(playing);

    if(showCall){
      var callY = H * 0.76;
      var btnRadius = 80 + (bass * 6);

      drawPhoneIcon(W * 0.3, callY, btnRadius, '#ff3b30', true);
      ctx.fillStyle = '#ffffff';
      ctx.font = '600 38px ' + fontStyle;
      ctx.fillText('Decline', W * 0.3, callY + btnRadius + 50);

      drawPhoneIcon(W * 0.7, callY, btnRadius, '#34c759', false);
      ctx.fillStyle = '#ffffff';
      ctx.font = '600 38px ' + fontStyle;
      ctx.fillText('Accept', W * 0.7, callY + btnRadius + 50);
    }

    if(handle){
      ctx.font = '400 30px ' + fontStyle;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText(handle, W / 2, H * 0.06);
    }
  }

  draw();
})();
</script>
</body>
</html>
